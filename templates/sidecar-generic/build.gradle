plugins {
    // plugins 块只认字面量；版本占位由 modsmith 按 GRADLE_VERSIONS 表文本替换（__LOOM__ 等）
    id 'fabric-loom' version '__LOOM__'
    id 'java'
}

version = '__VERSION__'
group = 'dev.modsmith'
base {
    archivesName = 'modsmith-sidecar'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:__MCVERSION__"
    mappings "net.fabricmc:yarn:__MCVERSION__+build.__YARNBUILD__:v2"
    modImplementation "net.fabricmc:fabric-loader:__LOADER__"
    modImplementation "net.fabricmc.fabric-api:fabric-api:__FABRICAPI__"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", '__MCVERSION__'
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": '__MCVERSION__'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
