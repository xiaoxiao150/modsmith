name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 本地开发用 junction 指向宿主项目的 node_modules；CI 上没有那些路径，
      # 所以走 npm ci（lock 是从 registry 生成的真锁，不含任何本机路径）
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          MODSMITH_TEST_JAR: test/fixtures/tiny-mod.jar
